[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handforge"
version = "1.3.2"
description = "Cross-platform audio and video converter (GUI + headless CLI) built with PyQt6 and FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VoxHash Technologies", email = "contact@voxhash.dev" }]
dependencies = ["PyQt6"]

[project.scripts]
handforge = "handforge.cli:main"

[project.urls]
Homepage = "https://github.com/VoxHash/HandForge"
Documentation = "https://github.com/VoxHash/HandForge/blob/main/docs/index.md"
Issues = "https://github.com/VoxHash/HandForge/issues"

[tool.setuptools.packages.find]
include = ["handforge*"]
exclude = ["tests*", "native*"]

[tool.setuptools.package-data]
handforge = ["data/*.json", "i18n/locales/*.json", "companion/static/*"]

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 127
extend-ignore = ['E203', 'E266', 'E501', 'W503']
exclude = [
    '.git',
    '__pycache__',
    '.venv',
    'venv',
    'build',
    'dist',
    '.eggs',
    '*.egg-info'
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'venv/',
    '.venv/',
    'build/',
    'dist/',
    '*.egg-info/'
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]
